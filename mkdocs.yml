# Site Information
site_name: Job Application Assistant
site_description: Automated job application system with multi-agent architecture built on Google ADK

# Build Configuration
docs_dir: .  # Look for files in the parent directory  
site_dir: site  # Build output to site directory

# Exclude patterns
exclude_docs: |
  node_modules/
  __pycache__/
  .git/
  .env
  *.pyc
  *.py
  JobSpy/
  deprecated/
  **/token.json
  **/credentials.json
  **/gcp-oauth.json
  **/*.pickle
  **/job-docs-deploy-key
  **/job-docs-deploy-key.pub
  orchestrator_agent/token.json
  orchestrator_agent/credentials_token.pickle
  orchestrator_agent/gcp-oauth.json
  orchestrator_agent/
  browser_job_*/
  logs/
  *.log
  *.db
  *.db-shm
  *.db-wal
  requirements*.txt
  pyproject.toml
  start_*.sh
  fix_*.py
  extension_api.py

# Theme Configuration
theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top

# Navigation
nav:
  - 'Home': 'README.md'
  - 'Sub-Agents':
      - 'Job Scraper': 'orchestrator_agent/sub_agents/job_scraper_agent/README.md'
      - 'Resource Manager': 'orchestrator_agent/sub_agents/resource_manager_agent/README.md'
      - 'Content Generator': 'orchestrator_agent/sub_agents/content_generator_agent/README.md'
      - 'Application Submitter': 'orchestrator_agent/sub_agents/application_submitter_agent/README.md'
      - 'Database Agent': 'orchestrator_agent/sub_agents/database_agent/README.md'
      - 'Email Assistant': 'orchestrator_agent/sub_agents/email_assistant_agent/README.md'
  - 'Tools':
      - 'Database & Google Tools': 'orchestrator_agent/tools/README.md'
  - 'Extensions':
      - 'Chrome Extension': 'chrome-extension/README.md'

# Markdown Extensions (for better README rendering)
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences